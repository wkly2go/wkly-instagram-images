name: CI

# 합치기 전에 자동으로 확인 (2026-11-19): 형식 검사 · 자동 시험 · 화면 시험 · 빌드 · 첫 화면 묶음 크기
# 공개 저장소라 무료. 저장소를 비공개로 바꾸면 무료 분량(월 2,000분)을 넘을 수 있으니 그때는 main 에 합칠 때만 돌릴 것.
on:
  pull_request:
    branches: [main]
    paths: ['erp/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['erp/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: erp/.node-version
          cache: npm
          cache-dependency-path: erp/package-lock.json
      - run: npm ci
      - name: 형식 검사
        run: npx tsc --noEmit -p .
      - name: 자동 시험
        run: npm run test:all
      - name: 화면 시험
        run: npm run test:ui
      - name: 빌드
        run: npm run build
      - name: 첫 화면 묶음 크기
        run: npm run check:bundle
