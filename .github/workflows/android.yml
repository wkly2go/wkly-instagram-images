# WKLY 인트라넷 안드로이드 앱(APK)을 만들어 GitHub 릴리스 'android' 에 올림 (대표 지시 2026-11-04 "앱으로 설치할 수 있게")
#  - 앱은 인트라넷 웹을 띄우는 껍데기(TWA) → 화면 · 기능 변경은 웹 배포만으로 바로 반영, APK 는 거의 다시 만들 일 없음
#  - 서명 키는 저장소에 없음: 이 작업의 OIDC 토큰으로 Supabase 함수 android-key 에서 받음 (처음엔 만들어 보관)
#  - 내려받기: https://github.com/wkly2go/wkly-instagram-images/releases/download/android/wkly-erp.apk
#  - 'android' 릴리스는 최신(latest)으로 표시하지 않음 → PC 프로그램 자동 업데이트에 영향 없음
name: android-app

on:
  push:
    branches: [main]
    paths:
      - 'erp/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 서명 키 받기 (없으면 만들어 보관)
        run: |
          set -euo pipefail
          F=https://hophgcpszenrvchvbkav.supabase.co/functions/v1/android-key
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=wkly-android-key" | jq -r .value)
          R=$(curl -sS -X POST "$F" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"action":"get"}')
          if [ "$(echo "$R" | jq -r '.missing // false')" = "true" ]; then
            PW=$(openssl rand -hex 24)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/wkly.jks" -storepass "$PW" -keypass "$PW" -alias wkly -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=THE WKLY, O=THE WKLY, C=KR"
            FP=$(keytool -list -v -keystore "$RUNNER_TEMP/wkly.jks" -storepass "$PW" -alias wkly | grep 'SHA256:' | sed 's/.*SHA256: //')
            jq -n --arg k "$(base64 -w0 "$RUNNER_TEMP/wkly.jks")" --arg p "$PW" --arg f "$FP" '{action:"set",keystore:$k,password:$p,fingerprint:$f}' \
              | curl -sSf -X POST "$F" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d @- > /dev/null
            echo "새 서명 키를 만들어 보관했습니다."
          else
            PW=$(echo "$R" | jq -r .password)
            echo "::add-mask::$PW"
            echo "$R" | jq -r .keystore | base64 -d > "$RUNNER_TEMP/wkly.jks"
          fi
          test -s "$RUNNER_TEMP/wkly.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/wkly.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/wkly.jks" -storepass "$PW" -alias wkly | grep 'SHA256:' | sed 's/.*SHA256: //')
          echo "서명 지문(SHA-256): \`$FP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: APK 만들기
        working-directory: erp/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/wkly-erp.apk"

      - name: 릴리스 'android' 에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view android > /dev/null 2>&1; then
            gh release create android --title "WKLY 인트라넷 안드로이드 앱" --latest=false \
              --notes "휴대폰에서 wkly-erp.apk 를 내려받아 설치합니다. 화면 · 기능은 웹에서 바로 반영되므로 앱을 다시 설치할 필요가 거의 없습니다."
          fi
          gh release upload android "$RUNNER_TEMP/wkly-erp.apk" --clobber
