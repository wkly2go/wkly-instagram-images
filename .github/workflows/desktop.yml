# WKLY 인트라넷 PC 프로그램: 윈도우(.exe) · 맥(.dmg/.zip) 설치 파일을 만들어 GitHub 릴리스에 올림
#  - 대표 지시 2026-10-23 "자동 업데이트 가능하게 · 주기적으로 설치하는 번거로움을 없애"
#    → main 에 PC 프로그램(erp/desktop) 변경이 들어오고 package.json 의 version 이 새 번호면 저절로 만들어 공개
#    → 설치된 PC 프로그램이 30분마다 확인해 받아 두고, 손대지 않을 때 저절로 설치 (사람이 다시 설치할 일 없음)
#  - 같은 번호의 릴리스가 이미 있으면 건너뜀 (번호를 올려야 새 버전)
#  - Actions 탭 › desktop-app › Run workflow 로 직접 실행도 가능
#  - 윈도우 · 맥 파일을 모두 올린 뒤에야 릴리스를 공개 (그 전에는 초안이라 '최신'이 바뀌지 않음 → 내려받기 404 방지)
name: desktop-app

on:
  push:
    branches: [main]
    paths:
      - 'erp/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-app
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: 이 번호의 릴리스가 이미 있는지
        run: |
          V="v$(node -p "require('./erp/desktop/package.json').version")"
          # 공개된 릴리스가 있으면 건너뜀 · 초안(지난번에 중간에 멈춤)이면 다시 만들어 마저 공개
          DRAFT=$(gh release view "$V" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then echo "release=false" >> "$GITHUB_OUTPUT"; echo "$V 이미 공개됨 · 건너뜀"; else echo "release=true" >> "$GITHUB_OUTPUT"; echo "$V 만듦 (초안: $DRAFT)"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: erp/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    needs: [check, windows]
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: erp/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  publish:
    needs: [check, windows, mac]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 윈도우 · 맥 파일이 다 올라간 초안 릴리스를 공개
        run: gh release edit "v$(node -p "require('./erp/desktop/package.json').version")" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
