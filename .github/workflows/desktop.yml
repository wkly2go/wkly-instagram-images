# WKLY 인트라넷 PC 프로그램: 윈도우(.exe) · 맥(.dmg) 설치 파일을 만들어 GitHub 릴리스에 올림
#  - 지금은 자동 실행 꺼 둠: Actions 탭에서 직접 실행할 때만 만듦 (2026-10-20 대표 지시)
#  - 새 버전을 내려면 erp/desktop/package.json 의 version 을 올린 뒤 직접 실행 (릴리스 이름: v버전)
#    version 은 '공개된 최신'과 같게 둘 것: 인트라넷이 이 값보다 낮은 PC 프로그램에 업데이트 안내를 띄움
#  - 인트라넷 '/download' 페이지는 항상 최신 릴리스의 파일로 연결됨
#  - 윈도우 · 맥 파일을 모두 올린 뒤에야 릴리스를 공개 (그 전에는 초안이라 '최신'이 바뀌지 않음 → 내려받기 404 방지)
name: desktop-app

# 대표 지시 2026-10-20: 당분간 새 PC 프로그램을 자동으로 만들지 않음 (변경은 웹 인트라넷에서 먼저 검토).
# 새 버전을 낼 때만 Actions 탭 › desktop-app › Run workflow 로 직접 실행
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-app
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: erp/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    needs: windows
    runs-on: macos-latest
    defaults:
      run:
        working-directory: erp/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 윈도우 · 맥 파일이 다 올라간 초안 릴리스를 공개
        run: gh release edit "v$(node -p "require('./erp/desktop/package.json').version")" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
