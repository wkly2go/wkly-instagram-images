name: Refresh Seoul event snapshot

on:
  schedule:
    # 01:30 KST, every day.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seoul-event-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: erp/.node-version
      - name: Update only the public snapshot branch
        shell: bash
        run: |
          snapshot="$(mktemp "$RUNNER_TEMP/seoul-events.XXXXXX")"
          trap 'rm -f "$snapshot"' EXIT
          node --experimental-strip-types erp/scripts/refresh-seoul-events.mjs > "$snapshot"
          git fetch --depth=1 origin refs/heads/data/seoul-events
          git worktree add --detach "$RUNNER_TEMP/seoul-data" FETCH_HEAD
          mv "$snapshot" "$RUNNER_TEMP/seoul-data/seoul-events.json"
          cd "$RUNNER_TEMP/seoul-data"
          git add -- seoul-events.json
          if git diff --cached --quiet -- seoul-events.json; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public Seoul event snapshot'
          git push origin HEAD:refs/heads/data/seoul-events
