// THE WKLY 인트라넷 안드로이드 앱 (TWA: 인트라넷 웹을 앱 화면으로 띄움 · 내용은 웹에서 바로 반영)
plugins {
    id 'com.android.application'
}

def code = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'com.thewkly.erp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thewkly.erp'
        minSdk 21
        targetSdk 34
        versionCode code
        versionName "1.0.${code}"
        manifestPlaceholders = [
            hostName    : 'wkly-erp.pages.dev',
            defaultUrl  : 'https://wkly-erp.pages.dev/',
            launcherName: 'WKLY ERP',
        ]
    }

    signingConfigs {
        release {
            // 키는 저장소에 없음: 빌드(GitHub Actions)가 Supabase Vault 에서 받아 KEYSTORE_PATH 에 둠
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'missing.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'wkly'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
