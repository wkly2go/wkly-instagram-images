<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#FFFFFF"></head><body><title>화석박물관 현장 실측</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: one-column field tool — sticky header, filter bar, card list, fixed bottom tab bar. Tape-measure yellow marks every measurement. */
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --sunk:#E9EBE7; --line:#D5D9D2; --ink:#1B211E; --muted:#5E6862; --faint:#8C958F;
  --tape:#F2B200; --tape-ink:#2A2100; --tape-soft:#FFF4CC;
  --ok:#1F8A4C; --ok-soft:#E3F3E8; --warn:#D9530F; --warn-soft:#FDEBDF; --na:#8C958F; --na-soft:#ECEEEB;
  --hi:#C2262E; --mid:#B7791F; --lo:#5E6862;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync[data-s="live"] i{background:var(--ok)} .sync[data-s="saving"] i{background:var(--tape)} .sync[data-s="err"] i{background:var(--warn)}

/* filter bar */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,57px));z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:flex;gap:6px;align-items:center;min-height:36px}
.chip b{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.75}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px}

/* group */
.grp{margin-top:18px}
.grp h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.02em}
.grp h2 .mono{font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.card[data-st="done"]{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.card[data-st="done"]::before{background:var(--ok)}
.card[data-st="more"]{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.card[data-st="more"]::before{background:var(--warn)}
.card[data-st="na"]{background:var(--na-soft)} .card[data-st="na"]::before{background:var(--na)}
.card[data-st="na"] .ttl{text-decoration:line-through;color:var(--muted)}
.head{display:flex;gap:10px;align-items:center;padding:12px 10px 12px 16px;width:100%;text-align:left;background:none;border:0;min-height:56px}
.code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);min-width:38px}
.ttl{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.35}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted);font-weight:400}
.pri{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;border:1px solid currentColor}
.pri.h{color:var(--hi)} .pri.m{color:var(--mid)} .pri.l{color:var(--lo)}
.dimsum{font-family:var(--f-mono);font-size:12px;background:var(--tape-soft);color:var(--ink);border-radius:4px;padding:1px 6px;font-weight:600}
.pc{font-size:12px;color:var(--muted)}
.tick{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tick svg{width:22px;height:22px;stroke:transparent}
.card[data-st="done"] .tick{background:var(--ok);border-color:var(--ok)} .card[data-st="done"] .tick svg{stroke:#fff}
.card[data-st="more"] .tick{border-color:var(--warn);color:var(--warn);font-weight:800}
.body{padding:0 14px 14px 16px;display:flex;flex-direction:column;gap:12px}
.pt{font-size:14px;color:var(--ink);white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px}
.note-pop{font-size:13px;border-left:3px solid var(--tape);padding:4px 10px;color:var(--muted);white-space:pre-wrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 4px;font-size:13.5px;font-weight:600;min-height:44px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="todo"]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"][data-v="done"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="more"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na);color:#fff}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.num{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.num:focus-within{border-color:var(--tape)}
.num input{border:0;background:transparent;width:100%;min-width:0;padding:10px;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.num span{padding:0 10px;font-size:12px;color:var(--faint)}
.num.has{border-color:color-mix(in srgb,var(--tape) 70%,var(--line));background:var(--tape-soft)}
textarea,.txt{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;min-height:44px;resize:vertical}
.extra{display:grid;grid-template-columns:1fr 120px 40px;gap:6px;align-items:center}
.extra input{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);min-width:0}
.extra input.v{font-family:var(--f-mono);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.tape{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.66);color:#fff;font-family:var(--f-mono);font-size:10.5px;padding:3px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .badge{position:absolute;top:4px;left:4px;background:var(--tape);color:var(--tape-ink);font-family:var(--f-mono);font-size:10.5px;font-weight:600;border-radius:4px;padding:0 4px}
.ph .warnb{position:absolute;top:4px;right:4px;background:var(--warn);color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
.subchk{display:flex;flex-direction:column;gap:4px}
.subchk label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:14px;min-height:44px}
.subchk input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin-top:1px}
.subchk label.on{background:var(--ok-soft);color:var(--muted)}
.subchk label.on span{text-decoration:line-through}
.ref{font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--muted)}
.ref b{color:var(--ink);font-weight:600}
.ref ul{margin:4px 0 0;padding-left:18px}
.calc{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px}

/* home */
.hero{padding-block:18px 6px}
.hero .when{font-size:13px;color:var(--muted)}
.hero h2{font-size:22px;line-height:1.25;margin:4px 0 0;text-wrap:balance;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.stat .n{font-family:var(--f-mono);font-size:22px;font-weight:600}
.stat .n small{font-size:13px;color:var(--muted)}
.stat .l{font-size:13px;font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .a{background:var(--ok)} .meter .b{background:var(--warn)} .meter .c{background:var(--na)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:14px}
.panel ol,.panel ul{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.panel li{margin:3px 0}
.todo-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.todo-row:first-of-type{border-top:0}
.todo-row .code{min-width:44px}
.notice{font-size:13px;border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--ink);margin-top:12px}
.notice[hidden]{display:none}

/* collaborators */
.peers{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.peers:empty{display:none}
.peer{flex:none;display:flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 7px;background:var(--surface);white-space:nowrap}
.peer i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.peer.me{border-color:var(--ink)}
.peer b{font-weight:600}
.editing{font-size:11.5px;font-weight:600;color:#fff;background:#2F6FDB;border-radius:4px;padding:1px 6px}
.card.live{box-shadow:0 0 0 2px #2F6FDB inset}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--tape)}100%{box-shadow:0 0 0 0 transparent}}
.top .wrap+.wrap{padding-block:0}
.top .wrap+.wrap .peers{padding-bottom:8px}
/* keyboard */
.card.kb{outline:3px solid #2F6FDB;outline-offset:1px}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface);display:inline-block;min-width:22px;text-align:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:center}
@media (min-width:700px){.fields{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.tabs button{font-size:12px}}
/* recorder */
.micfab{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:26;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;min-height:52px;min-width:52px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.micfab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.micfab.on{background:#D32F2F;border-color:#D32F2F;color:#fff}
.micfab.on .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
.markfab{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:26;border:2px solid var(--tape-ink);background:var(--tape);color:var(--tape-ink);border-radius:999px;min-height:48px;padding:0 14px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.rtimer{font-family:var(--f-mono);font-size:44px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.lvl{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
.recbtn{min-height:64px;font-size:18px}
.recbtn.stop{background:#D32F2F;border-color:#D32F2F;color:#fff}
.aud{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.aud h4{margin:0;font-size:15px}
.aud audio{width:100%;height:40px}
.mark{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.mark .mono{font-size:12px;background:var(--tape-soft);border-radius:4px;padding:1px 6px;font-weight:600;flex:none}
.mark input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{display:grid;grid-template-columns:repeat(7,1fr);max-width:880px;margin:0 auto}
.tabs button{border:0;background:none;padding:8px 2px 7px;font-size:11px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;position:relative}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--tape)}
.tabs .cnt{position:absolute;top:5px;right:calc(50% - 22px);font-family:var(--f-mono);font-size:9.5px;background:var(--warn);color:#fff;border-radius:8px;padding:0 4px;line-height:15px}

/* plan */
.planbox{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:70vh;margin-top:10px;-webkit-overflow-scrolling:touch}
.planin{position:relative;width:100%}
.planin img{display:block;width:100%;height:auto;max-width:none}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0}
.pin span{display:block;background:var(--tape);color:var(--tape-ink);font-family:var(--f-mono);font-size:11px;font-weight:600;border-radius:6px 6px 6px 0;padding:2px 5px;border:1.5px solid #1B211E;white-space:nowrap}
.pin.cur span{background:var(--warn);color:#fff}
.planhint{font-size:13px;color:var(--muted);margin-top:8px}

/* modal / annotator */
.modal{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal[hidden]{display:none}
.mhead{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.mhead h3{flex:1;margin:0;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.stagebox{background:#0d0f0e;overflow:auto;max-height:62vh}
.stage{position:relative;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage img{display:block;width:100%;height:auto;max-width:none;pointer-events:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:6px;padding:8px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tools .btn{min-height:40px;padding:8px 12px;font-size:13.5px}
.tools .btn[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.hint{font-size:13px;color:var(--muted);flex-basis:100%}
.dimlist{display:flex;flex-direction:column;gap:6px}
.dimrow{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dimrow .k{font-family:var(--f-mono);font-size:12px;background:var(--tape);color:var(--tape-ink);border-radius:4px;padding:1px 6px;font-weight:600}
.dimrow .v{font-family:var(--f-mono);font-weight:600;flex:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:2px solid var(--tape);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.sheet[hidden]{display:none}
.sheet .big{font-family:var(--f-mono);font-size:30px;font-weight:600;border:2px solid var(--tape);border-radius:12px;padding:8px 12px;width:100%;background:var(--tape-soft)}
.lbls{display:flex;gap:6px;flex-wrap:wrap}
.lbls button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:38px;font-size:13.5px}
.lbls button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.form{padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:880px;margin:0 auto;width:100%}
.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);min-height:44px}
.lab{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;display:block}

let idb=null;
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open("fossil-photos",1);q.onupgradeneeded=()=>q.result.createObjectStore("b");q.onsuccess=()=>{idb=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function idbPut(k,v){return new Promise(r=>{if(!idb)return r();try{const t=idb.transaction("b","readwrite");t.objectStore("b").put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()}catch(e){r()}})}
function idbGet(k){return new Promise(r=>{if(!idb)return r(null);try{const q=idb.transaction("b").objectStore("b").get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
const urlCache={};
async function photoURL(p){
  if(urlCache[p.id])return urlCache[p.id];
  const b=await idbGet(p.id);
  if(b){urlCache[p.id]=URL.createObjectURL(b);return urlCache[p.id]}
  if(p.asset)return "/_blob/"+p.asset;
  if(p.url)return p.url;
  return "";
}
function srcNow(p){return urlCache[p.id]||(p.asset?"/_blob/"+p.asset:"")}

}

  let first={rec:true,photos:true,cq:true};

    if(!s.metadata.fromCache){clearTimeout(timer);live=true;setSync("live","실시간 공유")}

      first[col]=false;

      const local=col==="rec"?recs:col==="photos"?photos:cq;
      const server=new Set(s.docs.map(d=>d.id));

    }

  sub("rec",s=>{s.docs.forEach(d=>{const v=d.data();const l=recs[d.id];if(!l||!l.at||(v.at||0)>=l.at)recs[d.id]=JSON.parse(JSON.stringify(v))})});
  sub("photos",s=>{s.docChanges().forEach(c=>{if(c.type==="removed"){if(!pendingLocal.has(c.doc.id))delete photos[c.doc.id]}else{const v=c.doc.data();const l=photos[c.doc.id];if(!l||(v.at||0)>=(l.at||0))photos[c.doc.id]=JSON.parse(JSON.stringify(v))}})});

}

  if(!me)askName();

  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sbPull()});

let sbBusy=false;
async function sbPull(){
  if(sbBusy)return;sbBusy=true;
  try{
    const r=await fetch(`${SB.url}/rest/v1/field_survey?project=eq.${SB.proj}&updated_at=gte.${encodeURIComponent(sbSince)}&select=kind,id,data,updated_at&order=updated_at.asc&limit=1000`,{headers:sbH()});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const rows=await r.json();const ids={rec:new Set(),photos:new Set(),cq:new Set(),audio:new Set()};
    const changed=applyRows(rows,ids);
    if(sbFirst){sbFirst=false;
      Object.keys(recs).forEach(k=>{if(!ids.rec.has(k))sbWrite("rec/"+k,recs[k])});
      Object.keys(photos).forEach(k=>{if(!ids.photos.has(k))sbWrite("photos/"+k,photos[k])});
      Object.keys(cq).forEach(k=>{if(!ids.cq.has(k))sbWrite("cq/"+k,cq[k])});
      Object.keys(audios).forEach(k=>{if(!ids.audio.has(k))sbWrite("audio/"+k,audios[k])});
    }
    [...sbDirty].forEach(p=>sbWrite(p,sbCurrent(p)));
    if(!sbDirty.size)setSync("live",rtOn?"실시간 공유":"공유 (5초 간격)");
    if(changed){lsSave();queueRender()}
  }catch(e){setSync("err","연결 안 됨 · 이 기기에 보관");console.warn(e)}
  finally{sbBusy=false}
}
function applyRows(rows,ids){let changed=false;ids=ids||{rec:new Set(),photos:new Set(),cq:new Set(),audio:new Set()};
    rows.forEach(row=>{
      if(row.updated_at>sbSince)sbSince=row.updated_at;
      const v=row.data||{},id=row.id;ids[row.kind]&&ids[row.kind].add(id);
      if(row.kind==="rec"){const l=recs[id];if(v._del){if(l&&(l.at||0)<=v.at){delete recs[id];changed=true}}else{const m=mergeRec(l,v);if(JSON.stringify(m)!==JSON.stringify(l)){recs[id]=m;lastSaved[id]=flat(m,"",{});changed=true;markFlash(id)}}}
      else if(row.kind==="photos"){const l=photos[id];if(v._del){if(l){delete photos[id];changed=true}}else if(!l||(v.at||0)>(l.at||0)){photos[id]=v;changed=true;if(v.item)markFlash(v.item)}}
      else if(row.kind==="audio"){const l=audios[id];if(recState&&recState.id===id){}else if(v._del){if(l){delete audios[id];changed=true}}else if(!l||(v.at||0)>(l.at||0)){audios[id]=v;changed=true}}
      else if(row.kind==="cq"){if(v._del){if(cq[id]){delete cq[id];delete ITEMS[id];changed=true}}else if(!cq[id]||JSON.stringify(cq[id])!==JSON.stringify(v)){cq[id]=v;addCQ(v);changed=true}}
    });
    return changed;
}
async function sbUpload(id,blob){
  const path=`${SB.proj}/${id}.jpg`;
  const r=await fetch(`${SB.url}/storage/v1/object/${SB.bucket}/${path}`,{method:"POST",headers:sbH({"Content-Type":"image/jpeg","x-upsert":"true"}),body:blob});
  if(!r.ok)throw new Error("HTTP "+r.status);
  if(photos[id]){photos[id].url=`${SB.url}/storage/v1/object/public/${SB.bucket}/${path}`;savePhoto(id)}
  pendingLocal.delete(id);queueRender();
}

function dimSummary(k){
  const it=ITEMS[k],r=recs[k]||{},v=r.v||{};const out=[];
  it.f.forEach(([fk,l])=>{if(v[fk]!==undefined&&v[fk]!=="")out.push(`${l.replace(/·.*$/,"")} ${fmt(v[fk])}`)});
  (r.ex||[]).forEach(e=>{if(e.v)out.push(`${e.l||"기타"} ${fmt(e.v)}`)});
  return out.join(" · ");
}

["#fcam","#falb"].forEach(s=>$(s).addEventListener("change",async e=>{

function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const max=2000;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res({b,w,h}):rej(new Error("이미지를 처리하지 못했습니다")),"image/jpeg",.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("이미지를 열 수 없습니다"))};img.src=u})}
function nextSeq(k){const n=photosOf(k).reduce((m,p)=>Math.max(m,p.seq||0),0);return n+1}
async function addPhoto(file,k){
  let c;try{c=await compress(file)}catch(err){toast(err.message);return null}
  const id="ph"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const seq=nextSeq(k);const it=ITEMS[k];
  const shot=guessShot(k);
  photos[id]={id,item:k,seq,seqLabel:`${it.code}-${seq}`,w:c.w,h:c.h,dims:[],memo:"",shot,pin:null,ts:Date.now(),asset:null,by:me};
  await idbPut(id,c.b);urlCache[id]=URL.createObjectURL(c.b);
  pendingLocal.add(id);savePhoto(id);upload(id,c.b);
  return id;
}
const SHOTMAP={M01:"P01",M02:"P12",M03:"P13",M05:"P07",M06:"P07",M07:"P05",M08:"P05",M09:"P05",M10:"P08",M11:"P08",M12:"P09",M13:"P09",M14:"P09",M15:"P10",M16:"P14",M17:"P06",M18:"P04",M20:"P11",M21:"P11",M25:"P18",M26:"P17",M27:"P18",M28:"P18",M29:"P19",M31:"P15",M32:"P16",X1:"P20",X2:"P21",X3:"P22",X4:"P23",X5:"P23"};
function guessShot(k){return SHOTMAP[k]||""}
async function upload(id,blob){
  if(SB_ON){try{await sbUpload(id,blob)}catch(e){console.warn(e)}return}
  if(!assets)return;
  try{const r=await assets.upload(blob,{type:"image/jpeg"});if(photos[id]){photos[id].asset=r.id;savePhoto(id)}pendingLocal.delete(id);queueRender()}
  catch(e){console.warn(e);if(e&&e.code==="quota_or_state")toast("저장 공간이 가득 찼습니다. 사진은 이 기기에 남아 있습니다.")}
}
async function retryUploads(manual){
  if(!assets&&!SB_ON){if(manual)toast("이 화면에서는 사진 업로드 권한이 없습니다");return}
  const list=Object.values(photos).filter(p=>!p.asset&&!p.url);let n=0;
  for(const p of list){const b=await idbGet(p.id);if(b){await upload(p.id,b);n++}}
  if(manual)toast(n?`사진 ${n}장 업로드를 시도했습니다`:"이 기기에 남은 사진이 없습니다");
}

function lineLabelPos(d,W,H){const ax=d.a[0]*W,ay=d.a[1]*H,bx=d.b[0]*W,by=d.b[1]*H;return [(ax+bx)/2,(ay+by)/2,ax,ay,bx,by]}
function dimSVG(d,i,W,H,temp){
  const [mx,my,ax,ay,bx,by]=lineLabelPos(d,W,H);const s=Math.max(W,H)/1000;
  const ang=Math.atan2(by-ay,bx-ax),nx=-Math.sin(ang)*10*s,ny=Math.cos(ang)*10*s;
  const txt=d.v?`${d.l?d.l+" ":""}${fmt(d.v)}`:"?";const tw=(txt.length*9+16)*s,th=26*s;
  const ln=(sw,c)=>`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${sw*s}" stroke-linecap="round"/><line x1="${ax-nx}" y1="${ay-ny}" x2="${ax+nx}" y2="${ay+ny}" stroke="${c}" stroke-width="${sw*s}"/><line x1="${bx-nx}" y1="${by-ny}" x2="${bx+nx}" y2="${by+ny}" stroke="${c}" stroke-width="${sw*s}"/>`;
  return `<g ${temp?"":`data-dim="${i}" style="cursor:pointer"`}>${ln(7,"#111")}${ln(3.5,"#F5C030")}<rect x="${mx-tw/2}" y="${my-th/2}" width="${tw}" height="${th}" rx="${5*s}" fill="#F5C030" stroke="#111" stroke-width="${2*s}"/><text x="${mx}" y="${my+6*s}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="${17*s}" fill="#111">${esc(txt)}</text></g>`;
}
function drawAnn(){

  svg.innerHTML=h;
}

function startSeg(){

  mr.ondataavailable=e=>{if(e.data&&e.data.size){chunks.push(e.data);idbPut(segId+"_part",new Blob(chunks,{type}))}};
  mr.onstop=async()=>{
    const blob=new Blob(chunks,{type});const ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";

}

let resuming=false;
async function resumeRec(why){
  const r=recState;if(!r||r.stopping||resuming)return;resuming=true;
  try{
    try{if(r.mr&&r.mr.state!=="inactive")r.mr.stop()}catch(e){}
    r.stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});
    const ns=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    r.stream=ns;
    try{if(r.ac){const src=r.ac.createMediaStreamSource(ns);src.connect(r.an)}}catch(e){}
    const a=audios[r.id];if(a){(a.marks=a.marks||[]).push({t:Date.now()-r.start,text:"(녹음 잠시 끊김 → 자동으로 다시 시작)",by:me,auto:true});saveAudio(r.id)}
    startSeg();watchTrack();toast("녹음을 이어서 시작했습니다");
  }catch(e){toast("마이크를 다시 켜지 못했습니다. 녹음 버튼을 눌러 확인해 주세요");console.warn(e)}
  finally{resuming=false}
}

let kbSel="";
function visCards(){return [...document.querySelectorAll("#view .card[data-k]")]}
function selCard(k,scroll){document.querySelectorAll(".card.kb").forEach(c=>c.classList.remove("kb"));kbSel=k||"";const c=k&&document.querySelector(`.card[data-k="${CSS.escape(k)}"]`);if(c){c.classList.add("kb");if(scroll){const r=c.getBoundingClientRect();const top=(document.querySelector(".bar")?.getBoundingClientRect().bottom)||120;if(r.top<top+8||r.bottom>innerHeight-90)window.scrollBy({top:r.top-top-12,behavior:"smooth"})}}}
function moveSel(d){const cs=visCards();if(!cs.length)return;let i=cs.findIndex(c=>c.dataset.k===kbSel);i=i<0?(d>0?0:cs.length-1):Math.max(0,Math.min(cs.length-1,i+d));selCard(cs[i].dataset.k,true)}
function setSt(k,v){rec(k).st=v;saveRec(k,true);rerenderCard(k);updateCounts();selCard(k);toast(`${ITEMS[k].code} ${ST[v]}`)}
function firstField(k){const c=document.querySelector(`.card[data-k="${CSS.escape(k)}"]`);return c&&c.querySelector("input[data-fv],textarea[data-note],textarea[data-ans],input[type=checkbox][data-chk]")}
document.addEventListener("keydown",e=>{
  if(e.isComposing||e.keyCode===229)return;
  const t=e.target,inField=/INPUT|TEXTAREA|SELECT/.test(t.tagName);
  // Esc: leave field / close layers
  if(e.key==="Escape"){
    if(!$("#dimSheet").hidden){$("#dsCancel").click();e.preventDefault();return}
    if(!$("#nameSheet").hidden){return}
    if(inField){const c=t.closest(".card");t.blur();if(c)selCard(c.dataset.k);e.preventDefault();return}
    if(!$("#ann").hidden){$("#annClose").click();e.preventDefault();return}
    if(!$("#recPanel").hidden){$("#recClose").click();e.preventDefault();return}
    if(kbSel&&open.has(kbSel)){open.delete(kbSel);rerenderCard(kbSel);selCard(kbSel);e.preventDefault()}
    return;
  }
  // Cmd/Ctrl+Enter inside a card: mark done
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){const c=t.closest&&t.closest(".card");const k=c?c.dataset.k:kbSel;if(k&&ITEMS[k]){e.preventDefault();t.blur&&t.blur();setSt(k,"done")}return}
  // Enter in a dimension field: go to next field
  if(e.key==="Enter"&&inField&&(t.dataset.fv||t.dataset.exv||t.dataset.exl)){e.preventDefault();const c=t.closest(".card");const fs=[...c.querySelectorAll("input[data-fv],input[data-exl],input[data-exv],textarea[data-note]")];const i=fs.indexOf(t);const nx=fs[i+(e.shiftKey?-1:1)];if(nx){nx.focus();nx.select&&nx.select()}return}
  if(inField||e.metaKey||e.ctrlKey||e.altKey)return;
  if(!$("#ann").hidden||!$("#dimSheet").hidden||!$("#nameSheet").hidden)return;
  const k=e.key;
  if(/^[1-7]$/.test(k)){const tb=TABS[+k-1];if(tb){e.preventDefault();tab=tb[0];try{history.replaceState(null,"","#"+tab)}catch(_){}window.scrollTo(0,0);kbSel="";render();fillImgs()}return}
  if(k==="/"){const q=$("#q");if(!$("#bar").hidden&&q){e.preventDefault();q.focus()}return}
  if(k==="r"||k==="R"){e.preventDefault();if(recState)stopRec();else{$("#recPanel").hidden=false;document.body.style.overflow="hidden";renderRec();setTimeout(()=>$("#rStart")&&$("#rStart").focus(),50)}return}
  if(k==="m"||k==="M"){if(recState){e.preventDefault();$("#markFab").click()}return}
  if(!(tab in filt))return;
  if(k==="ArrowDown"||k==="j"||k==="J"){e.preventDefault();moveSel(1);return}
  if(k==="ArrowUp"||k==="k"||k==="K"){e.preventDefault();moveSel(-1);return}
  if(!kbSel||!ITEMS[kbSel])return;
  if(k==="Enter"||k===" "){e.preventDefault();const was=open.has(kbSel);was?open.delete(kbSel):open.add(kbSel);rerenderCard(kbSel);selCard(kbSel,true);if(!was){focusItem=kbSel;trackMe&&trackMe();const f=firstField(kbSel);if(f&&k==="Enter")setTimeout(()=>f.focus(),30)}return}
  const map={d:"done",a:"more",n:"na",u:"todo"};const v=map[k.toLowerCase()];if(v){e.preventDefault();setSt(kbSel,v);return}
  if(k==="p"||k==="P"){e.preventDefault();pickFor=kbSel;$("#falb").click();return}
});

async function driveUp(folder,name,blob){

  const r=await fetch(SB.url+"/functions/v1/field-survey-drive",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+SB_JWT,apikey:SB_JWT},body:JSON.stringify({folder,name,mime,size:blob.size,origin:location.origin})});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.url)throw new Error(j.error||("HTTP "+r.status));

}

  if(driveBusy)return;driveBusy=true;const st=window.driveState={done:0,total:0,fail:[],running:true};
