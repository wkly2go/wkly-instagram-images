<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>WKLY 인트라넷</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fffff0; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: #1c44f1; }
      .card { background: #fff; border: 1px solid #d9d9d2; border-radius: 16px; padding: 32px 28px; text-align: center; max-width: 360px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 13px; color: #62625c; margin: 0 0 18px; }
      button { border: 0; border-radius: 8px; padding: 10px 18px; background: #1c44f1; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>인트라넷에 연결하지 못했습니다</h1>
      <p>인터넷 연결을 확인한 뒤 다시 시도하세요. 연결되면 자동으로 다시 엽니다.</p>
      <button type="button" onclick="go()">다시 시도</button>
    </div>
    <script>
      function go() { location.href = 'https://wkly-erp.pages.dev' }
      window.addEventListener('online', go)
      setInterval(() => navigator.onLine && fetch('https://wkly-erp.pages.dev/version.json', { cache: 'no-store' }).then(r => r.ok && go()).catch(() => {}), 15000)
    </script>
  </body>
</html>
